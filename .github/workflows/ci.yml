name: CI

on:
  pull_request:
    branches: [main]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: collect the pull request title, body, and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s\n' "$PR_TITLE" > pr-title.txt
          printf '%s\n' "$PR_BODY" > pr-body.txt
          git fetch --no-tags origin "$BASE_REF"
          git log --format=%B "origin/$BASE_REF..HEAD" > pr-commits.txt
      - name: no emoji, em dash, or en dash
        run: bash scripts/check-style.sh pr-title.txt pr-body.txt pr-commits.txt

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on these files:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
