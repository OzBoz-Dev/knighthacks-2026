name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: list the changed paths
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          # A change to this workflow runs every job, so the workflow change itself is tested.
          api=false; frontend=false
          if echo "$changed" | grep -Eq '^(api/|\.github/workflows/ci\.yml$)'; then api=true; fi
          if echo "$changed" | grep -Eq '^(frontend-digi/|\.github/workflows/ci\.yml$)'; then frontend=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "api=$api frontend=$frontend"

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: collect the pull request title, body, and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s\n' "$PR_TITLE" > pr-title.txt
          printf '%s\n' "$PR_BODY" > pr-body.txt
          git fetch --no-tags origin "$BASE_REF"
          git log --format=%B "origin/$BASE_REF..HEAD" > pr-commits.txt
      - name: no emoji, em dash, or en dash
        run: bash scripts/check-style.sh pr-title.txt pr-body.txt pr-commits.txt
      - name: conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$PR_TITLE"
          types='feat|fix|chore|docs|refactor|test|perf|ci|build'
          scopes='web|solana|api|databricks|fixtures|docs|repo'
          if [ "${#title}" -gt 72 ]; then echo "title has ${#title} characters; the limit is 72: $title"; exit 1; fi
          if ! printf '%s' "$title" | grep -Eq "^($types)\(($scopes)\): "; then
            echo "title must match <type>(<scope>): <subject> with type in {$types} and scope in {$scopes}: $title"; exit 1
          fi
          subject=${title#*: }
          case "$subject" in
            [a-z0-9]*) ;;
            *) echo "subject must start in lower case: $subject"; exit 1 ;;
          esac
          case "$subject" in
            *.) echo "subject must not end with a full stop: $subject"; exit 1 ;;
          esac
          echo "title check passed: $title"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on these files:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-digi
    steps:
      - uses: actions/checkout@v4
      # Node 24 LTS: the wallet packages in the lockfile need Node 22.13, 24.3, or later.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-digi/package-lock.json
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
